<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Не-сухо програмиране</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <!-- Particle canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Main container -->
    <div class="container">
      <div class="content">
        <!-- Header -->
        <header class="header">
          <h1 class="title">Не-сухо програмиране</h1>
          <p class="subtitle">Възможно ли е?</p>
          <p class="subtitle2">Аз съм Стефан. Хайде да програмираме заедно.</p>
        </header>

        <!-- Cards grid -->
        <div class="cards-grid">
          <a
            href="{{.URL}}"
            class="card"
            data-title="{{.Name}}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="card-inner">
              <div class="card-icon">
                <img src="assets/icon-portfolio.png" alt="{{.Name}}" loading="lazy" />
              </div>
              <div class="card-content">
                <h2 class="card-title">Примери</h2>
                <p class="card-description">Вдъхновѝ се</p>
              </div>
            </div>
            <div class="card-border"></div>
          </a>
          <a
            href="{{.URL}}"
            class="card"
            data-title="{{.Name}}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="card-inner">
              <div class="card-icon">
                <img src="assets/icon-blog.png" alt="{{.Name}}" loading="lazy" />
              </div>
              <div class="card-content">
                <h2 class="card-title">Блог</h2>
                <p class="card-description">Почети</p>
              </div>
            </div>
            <div class="card-border"></div>
          </a>
          <a
            href="{{.URL}}"
            class="card"
            data-title="{{.Name}}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="card-inner">
              <div class="card-icon">
                <img src="assets/icon-mentoring.png" alt="{{.Name}}" loading="lazy" />
              </div>
              <div class="card-content">
                <h2 class="card-title">Менторство</h2>
                <p class="card-description">Работѝ с мен</p>
              </div>
            </div>
            <div class="card-border"></div>
          </a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/particles.js"></script>
    <script src="/assets/cards.js"></script>
  </body>
</html>
